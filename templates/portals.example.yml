# Career-Ops Portal Scanner Configuration
# Save this to portals.yml

title_filter:
  positive:
    # -- Intelligence & National Security --
    - "Threat Analyst"
    - "Intelligence Analyst"
    - "OSINT"
    - "All-Source Analyst"
    - "Strategic Analyst"
    - "Counterintelligence"
    - "Security Specialist"
    - "Cleared"
    - "Top Secret"
    - "TS/SCI"
    # -- Operations, Supply Chain & Logistics --
    - "Operations Manager"
    - "Supply Chain Analyst"
    - "Process Improvement"
    - "Logistics"
    - "Continuous Improvement"
    - "Procurement"
    - "Vendor Management"
    # -- Policy, Research & Public Affairs --
    - "Policy Researcher"
    - "Public Affairs"
    - "Communications"
    - "Compliance"
    - "Legislative Analyst"
    - "Foreign Policy"
    # -- Data & Analytics --
    - "Data Analyst"
    - "Risk Analyst"
    - "Quantitative"
    - "Business Intelligence"
    - "Financial Analyst"
    # -- Consulting & Program Management --
    - "Management Consultant"
    - "Federal Consultant"
    - "Program Analyst"
    - "Project Manager"
  negative:
    # Exclude purely technical/unrelated roles
    - "Software Engineer"
    - "Frontend"
    - "Backend"
    - "Full Stack"
    - "DevOps"
    - "Nurse"
    - "Physician"
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "Firmware"
    - "Salesforce Admin"
    - "Mechanic"
    - "Technician"
  seniority_boost:
    - "MBA"
    - "Senior"
    - "Lead"
    - "Principal"
    - "Manager"

search_queries:
  # -- Clearance & Defense Specific Boards --
  - name: ClearanceJobs — Intelligence
    query: 'site:clearancejobs.com "Top Secret" "Intelligence Analyst" OR "Threat Analyst" Albuquerque OR Remote'
    enabled: true

  - name: ClearanceJobs — Operations
    query: 'site:clearancejobs.com "Top Secret" "Operations Manager" OR "Supply Chain" Albuquerque OR Remote'
    enabled: true

  - name: IntelligenceCareers — General
    query: 'site:intelligencecareers.gov "Analyst" OR "Operations" OR "Policy"'
    enabled: true

  # -- Broad Web Searches --
  - name: Cleared Operations Roles
    query: '"Top Secret" OR "TS/SCI" "Operations Manager" OR "Supply Chain Analyst" remote OR Albuquerque'
    enabled: true

  - name: Cleared Analyst Roles
    query: '"Top Secret" "Threat Analyst" OR "Intelligence Analyst" OR "Data Analyst" remote OR Albuquerque'
    enabled: true

  - name: Policy & Think Tank Roles
    query: '"Policy Researcher" OR "Public Affairs" "Think Tank" remote OR Washington DC'
    enabled: true

  - name: Federal Consulting Roles
    query: '"Top Secret" "Federal Consultant" OR "Management Consultant" remote OR Albuquerque'
    enabled: true

